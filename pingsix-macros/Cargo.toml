[package]
name = "pingsix-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1.0"
